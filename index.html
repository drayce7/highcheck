<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text to Number Lookup</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        
        .top-nav {
            position: absolute;
            top: 20px;
            right: 20px;
        }
        .admin-btn {
            background-color: #3b82f6;
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: bold;
            transition: 0.2s;
            border: 1px solid #2563eb;
        }
        .admin-btn:hover { background-color: #2563eb; }

        .container {
            display: flex;
            gap: 20px;
            background: #1e1e1e;
            padding: 30px;
            border-radius: 12px;
            border: 1px solid #333;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .box {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        label {
            font-size: 14px;
            color: #888;
            text-transform: uppercase;
            font-weight: bold;
        }
        
        /* Changed result-box to an input field */
        input {
            width: 250px;
            padding: 15px;
            font-size: 18px;
            background: #111;
            border: 2px solid #444;
            border-radius: 8px;
            color: white;
            outline: none;
            transition: 0.3s;
            box-sizing: border-box;
        }
        input:focus { border-color: #3b82f6; }
        
        /* Result input styling */
        #resultBox {
            background: #111;
            border: 2px solid #444;
            color: #ccc;
            font-weight: bold;
            font-size: 24px;
            text-align: center;
            cursor: pointer;
        }
        #resultBox:focus { border-color: #3b82f6; }
        #resultBox.success { border-color: #10b981; color: #10b981; }
        #resultBox.error { border-color: #ef4444; color: #ef4444; }
    </style>
</head>
<body>

    <div class="top-nav">
        <a href="admin.html" class="admin-btn">⚙️ Admin Page</a>
    </div>

    <div class="container">
        <div class="box">
            <label>Enter Text</label>
            <input type="text" id="textInput" placeholder="Type here..." autocomplete="off">
        </div>
        
        <div class="box">
            <label>Assigned Number (Click to copy)</label>
            <!-- Changed from div to input -->
            <input type="text" id="resultBox" value="Waiting..." readonly onclick="copyResult()">
        </div>
    </div>

    <script>
        const textInput = document.getElementById('textInput');
        const resultBox = document.getElementById('resultBox');

        function getDatabase() {
            return JSON.parse(localStorage.getItem('text_database')) || {};
        }

        // Real-time lookup
        textInput.addEventListener('input', function() {
            const inputVal = textInput.value.trim().toLowerCase();
            const database = getDatabase();

            if (inputVal === "") {
                resultBox.value = "Waiting...";
                resultBox.className = "";
                return;
            }

            if (database[inputVal]) {
                resultBox.value = database[inputVal];
                resultBox.className = "success";
            } else {
                resultBox.value = "Not Found";
                resultBox.className = "error";
            }
        });

        // Copy to clipboard when clicked
        function copyResult() {
            const textToCopy = resultBox.value;
            
            // Don't copy if it's empty or says "Waiting..." or "Not Found"
            if (!textToCopy || textToCopy === "Waiting..." || textToCopy === "Not Found") {
                return;
            }

            navigator.clipboard.writeText(textToCopy).then(() => {
                // Visual feedback: flash green
                const originalColor = resultBox.style.borderColor;
                resultBox.style.borderColor = "#10b981";
                resultBox.style.color = "#10b981";
                
                setTimeout(() => {
                    resultBox.style.borderColor = originalColor;
                    // Re-evaluate success class
                    if (textToCopy !== "Waiting...") {
                         resultBox.classList.add("success");
                    }
                }, 300);
            }).catch(err => {
                console.error("Failed to copy: ", err);
            });
        }
    </script>
</body>
</html>
